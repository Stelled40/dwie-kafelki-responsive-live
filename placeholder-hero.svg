<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Placeholder widoku glownego</title>
  <desc id="desc">Estetyczna plansza demonstracyjna z neutralna scena produktowa.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5efe6" />
      <stop offset="48%" stop-color="#e7d7c5" />
      <stop offset="100%" stop-color="#d4bca6" />
